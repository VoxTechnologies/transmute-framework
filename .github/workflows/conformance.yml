name: conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    # Static checks only: manifests, every stage in its eight places, Claude Code 2.1
    # facts, and the gate hook against fixtures. The --live checks need an
    # authenticated Claude Code session and stay a manual pre-release step.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep and PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep python3-yaml
      - name: Run conformance (static)
        run: bash scripts/conformance.sh
